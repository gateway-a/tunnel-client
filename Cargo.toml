[package]
name = "gateway-tunnel"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "gateway-tunnel"
path = "src/main.rs"

[dependencies]
socket2 = { version = "0.5", features = ["all"] }
ctrlc = "3"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
